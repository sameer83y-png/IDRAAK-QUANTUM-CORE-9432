name: IDRAAK QUANTUM APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Get Project Files
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Install Android SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Download Hindi Vosk Model
        run: |
          mkdir -p /tmp/vosk-hi
          curl -fL --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip \
            -o /tmp/vosk-hi/model.zip
          unzip -q /tmp/vosk-hi/model.zip -d /tmp/vosk-hi
          MODEL_DIR=$(find /tmp/vosk-hi -mindepth 1 -maxdepth 1 -type d -name "vosk-model-small-hi-0.22")
          test -n "$MODEL_DIR"
          mkdir -p app/src/main/assets/vosk
          mv "$MODEL_DIR" app/src/main/assets/vosk/hi

      - name: Download Indian English Vosk Model
        run: |
          mkdir -p /tmp/vosk-en
          curl -fL --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip \
            -o /tmp/vosk-en/model.zip
          unzip -q /tmp/vosk-en/model.zip -d /tmp/vosk-en
          MODEL_DIR=$(find /tmp/vosk-en -mindepth 1 -maxdepth 1 -type d -name "vosk-model-small-en-in-0.4")
          test -n "$MODEL_DIR"
          mv "$MODEL_DIR" app/src/main/assets/vosk/en-in

      - name: Verify Vosk Models
        run: |
          test -d app/src/main/assets/vosk/hi
          test -d app/src/main/assets/vosk/en-in
          test -f app/src/main/assets/vosk/hi/conf/model.conf
          test -f app/src/main/assets/vosk/en-in/conf/model.conf
          echo "Hindi and Indian English models are ready."

      - name: Download multilingual Whisper Small model for Urdu
        run: |
          mkdir -p app/src/main/assets/models
          curl -fL --retry 3 "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin" -o app/src/main/assets/models/ggml-small.bin
          test -s app/src/main/assets/models/ggml-small.bin
          MODEL_SIZE=$(stat -c%s app/src/main/assets/models/ggml-small.bin)
          test "$MODEL_SIZE" -gt 400000000
          echo "Whisper Small model downloaded: $MODEL_SIZE bytes"

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Run Android Lint
        run: gradle :app:lintDebug

      - name: Verify APK has no network permissions
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          PERMISSIONS="$("$AAPT" dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          if printf '%s\n' "$PERMISSIONS" | grep -Eq "android.permission.(INTERNET|ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE)"; then
            echo "ERROR: APK still declares a network permission."
            exit 1
          fi
          echo "Verified: APK declares no Internet or network-state permissions."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDRAAK-QUANTUM-DEBUG-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
